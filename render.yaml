# 2. Managed PostgreSQL Database
databases:
  - name: novapulse-db
    plan: free
    postgresMajorVersion: 15

services:
  # 1. NestJS Backend Service
  - type: web
    name: novapulse-backend
    env: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/src/main
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novapulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add your OAuth credentials manually in the Render Dashboard later
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # 3. Vite + React Frontend Static Site
  - type: web
    name: novapulse-frontend
    env: static
    rootDir: frontend/NovaPulse
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishDir: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://novapulse-backend.onrender.com
