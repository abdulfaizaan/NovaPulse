services:
  # 1. NestJS Backend Service
  - type: web
    name: novapulse-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:prod
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novapulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add your OAuth credentials manually in the Render Dashboard later
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false

# 2. Managed PostgreSQL Database
databases:
  - name: novapulse-db
    plan: free
    postgresMajorVersion: 15
